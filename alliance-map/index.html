<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bangladesh Election 2026 — alliance map by union, ward &amp; municipality</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    /* Netra house palette (matches the published election map) */
    --bg:#ede7de; --map-bg:#ddd5c8; --panel:rgba(255,255,254,.94); --line:rgba(60,55,50,.18);
    --ink:#1e140a; --ink2:#7a6858; --stroke:rgba(245,244,242,.76);
    --serif:"utopia-std",Georgia,'Times New Roman',serif;
    --bnp:#006cc9; --jam:#cf255f; --ind:#dc7c00; --iab:#6a2bd8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden;}
  #map{position:fixed;inset:0;background:var(--map-bg);}
  .leaflet-container{background:var(--map-bg);}

  .panel{position:absolute;z-index:1000;background:var(--panel);border:1px solid var(--line);
         box-shadow:0 8px 26px rgba(60,55,50,.16);backdrop-filter:blur(6px);}
  #legend{top:14px;left:14px;width:270px;padding:14px 15px;}
  #legend h1{font-size:15.5px;font-weight:800;line-height:1.25;margin-bottom:3px;}
  #legend .sub{font-size:11.5px;color:var(--ink2);line-height:1.45;margin-bottom:12px;}
  .lrow{display:flex;align-items:center;gap:8px;padding:5px 6px;cursor:pointer;border:1px solid transparent;}
  .lrow:hover{background:rgba(60,55,50,.07);} .lrow.off{opacity:.32;}
  .lrow .sw{width:14px;height:14px;flex-shrink:0;border:1px solid rgba(60,55,50,.25);}
  .lrow .nm{font-size:12.5px;font-weight:600;flex:1;}
  .lrow .ct{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;}
  .modebar{display:flex;gap:0;margin-bottom:9px;border:1px solid var(--line);}
  .mbtn{flex:1;background:transparent;border:none;border-right:1px solid var(--line);color:var(--ink2);
        font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 4px;cursor:pointer;}
  .mbtn:last-child{border-right:none;} .mbtn:hover{background:rgba(60,55,50,.07);color:var(--ink);}
  .mbtn.active{background:var(--ink);color:#fff;}
  .scale{display:flex;gap:0;margin:4px 0 2px;} .scale i{flex:1;height:9px;}
  .scaleLbl{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2);margin-bottom:8px;}
  .secthead{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);
            margin:11px 0 6px;padding-top:10px;border-top:1px solid var(--line);}

  /* ---- result card (NYT-style): floats by the cursor on desktop, bottom sheet on phones ---- */
  #card{
    position:fixed; z-index:1200; pointer-events:none; opacity:0; transition:opacity .12s;
    background:#fff; border:1px solid rgba(60,55,50,.16); box-shadow:0 8px 28px rgba(30,20,10,.20);
    padding:13px 15px 12px; width:330px; max-width:calc(100vw - 24px); color:var(--ink);
  }
  #card.on{opacity:1;}
  #card h3{font-family:var(--serif); font-size:15.5px; font-weight:700; line-height:1.25; margin-bottom:1px;}
  #card .csub{font-size:10.5px; color:var(--ink2); margin-bottom:9px; line-height:1.35;}
  #card .cgrid{display:grid; grid-template-columns:1fr auto; gap:14px; align-items:start;}
  #card .chead{display:grid; grid-template-columns:1fr 52px 38px; gap:6px; font-size:9px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); padding-bottom:4px;
    border-bottom:1px solid rgba(60,55,50,.18); margin-bottom:5px;}
  #card .crow{display:grid; grid-template-columns:1fr 52px 38px; gap:6px; font-size:12.5px;
    align-items:center; padding:2.5px 0;}
  #card .crow .nm{display:flex; align-items:center; gap:6px; min-width:0;}
  #card .crow .nm b{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #card .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;}
  #card .num{text-align:right; font-variant-numeric:tabular-nums; color:var(--ink2);}
  #card .pct{text-align:right; font-variant-numeric:tabular-nums; font-weight:700;}
  #card .mhead{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink2);text-align:right;padding-bottom:4px;border-bottom:1px solid rgba(60,55,50,.18);margin-bottom:5px;}
  #card .mnum{font-family:var(--serif); font-size:30px; font-weight:700; line-height:1; text-align:right;}
  #card .mwho{font-size:11px; font-weight:600; text-align:right; margin-top:2px;}
  #card .cfoot{margin-top:9px; padding-top:7px; border-top:1px solid rgba(60,55,50,.14);
    font-size:10.5px; color:var(--ink2); line-height:1.45;}
  @media(max-width:760px){
    #card{left:0 !important; right:0 !important; bottom:0 !important; top:auto !important;
      width:100%; max-width:100%; border-left:none; border-right:none; border-bottom:none;
      padding:14px 16px calc(14px + env(safe-area-inset-bottom)); pointer-events:auto;
      box-shadow:0 -6px 26px rgba(30,20,10,.22); transform:translateY(100%); transition:transform .18s, opacity .18s;}
    #card.on{transform:translateY(0);}
    #card .cgrid{gap:10px;}
    #card .mnum{font-size:26px;}
  }

  .hint{font-size:10.5px;color:var(--ink2);margin-top:9px;padding-top:9px;border-top:1px solid var(--line);line-height:1.45;}

  #info{top:14px;right:14px;width:290px;padding:14px 15px;max-height:calc(100vh - 28px);overflow:auto;}
  #info .ph{color:var(--ink2);font-size:12px;line-height:1.5;}
  #info h2{font-size:15px;font-weight:800;line-height:1.25;}
  #info .loc{font-size:11.5px;color:var(--ink2);margin:3px 0 10px;line-height:1.4;}
  .hero{display:flex;align-items:center;gap:10px;margin:2px 0 12px;}
  .hnum{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1;}
  .hlbl{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3;}
  .hlbl span{font-weight:400;color:var(--ink2);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
  .pill{display:inline-block;padding:2px 9px;font-size:10.5px;font-weight:700;color:#fff;margin-bottom:10px;}
  .bar{margin-bottom:7px;}
  .bar .top{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:2px;}
  .bar .top .p{color:var(--ink2);font-variant-numeric:tabular-nums;}
  .bar .track{height:7px;background:rgba(60,55,50,.10);border:1px solid var(--line);}
  .bar .fill{height:100%;}
  .meta{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:11px;color:var(--ink2);line-height:1.5;}

  #search{position:absolute;bottom:14px;left:14px;z-index:1000;width:270px;}
  #search input{width:100%;background:rgba(255,255,254,.95);border:1px solid var(--line);color:var(--ink);
                padding:9px 11px;font-size:12.5px;font-family:inherit;}
  #search input:focus{outline:1px solid var(--bnp);border-color:var(--bnp);}
  #res{max-height:190px;overflow:auto;border:1px solid var(--line);border-top:none;background:rgba(255,255,254,.98);display:none;}
  #res div{padding:7px 11px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--line);}
  #res div:hover{background:rgba(60,55,50,.07);}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1500;
           background:var(--bg);color:var(--ink2);font-size:13px;}
  @media(max-width:760px){
    #legend{width:calc(100vw - 28px);} #info{display:none;} #search{width:calc(100vw - 28px);}
    #legend.mini .lrow .ct{display:none;}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="loading">Loading map data…</div>

<div class="panel" id="legend">
  <h1>Who led where</h1>
  <div class="sub">Bangladesh 2026 · leading bloc in each union, city-corporation ward &amp; municipality</div>
  <div class="modebar" id="layers">
    <button class="mbtn active" data-l="units">Local areas</button>
    <button class="mbtn" data-l="seats">Constituencies</button>
  </div>
  <div class="modebar" id="modes">
    <button class="mbtn" data-m="winner">Winner</button>
    <button class="mbtn active" data-m="margin">Margin</button>
    <button class="mbtn" data-m="turnout">Turnout</button>
  </div>
  <div id="rows"></div>
  <div class="secthead">Area type</div>
  <div id="trows"></div>
  <div class="hint">Click any row to show/hide · click an area for its full vote breakdown</div>
</div>

<div class="panel" id="info">
  <div class="ph">Hover or tap an area to see its result.</div>
</div>

<div id="search">
  <input id="q" placeholder="Search union / ward / municipality…" autocomplete="off">
  <div id="res"></div>
</div>

<div id="card"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<script>
const B=['BNP','Jamaat','Independent','IAB','KM','GOP'];
const LBL={BNP:'BNP-led alliance',Jamaat:'Jamaat-led alliance',Independent:'Independent',
           IAB:'Islami Andolan (IAB)',KM:'Khelafat Majlish',GOP:'Gono Odhikar Parishad',
           Minor:'Other party',JaPa:'Jatiya Party',NCP:'NCP','Islami Front':'Islami Front',
           NoResult:'No election held',NoCentres:'No polling centres'};
// light = pale end of the margin/turnout ramp, dark = full-strength winner colour
const PAL={BNP:{l:'#9fd9ff',d:'#006cc9'}, Jamaat:{l:'#ffb2cc',d:'#cf255f'},
           Independent:{l:'#ffd99d',d:'#dc7c00'}, IAB:{l:'#d9c0ff',d:'#6a2bd8'},
           KM:{l:'#bce5cd',d:'#0f8a4d'}, GOP:{l:'#e0cdb8',d:'#8a6a4a'},
           Minor:{l:'#ddd8d0',d:'#9b9086'}, NoResult:{l:'#e6d9d9',d:'#c9b3b3'},
           NoCentres:{l:'#e3ded6',d:'#cfc8bd'}};
const C=Object.fromEntries(Object.entries(PAL).map(([k,v])=>[k,v.d]));
const TYPE={cc:'City-corporation ward',m:'Municipality',u:'Union',seat:'Parliamentary constituency'};
const LEG=['BNP','Jamaat','Independent','IAB','KM','GOP','Minor','NoResult','NoCentres'];
const on={}; LEG.forEach(b=>on[b]=true);
const TYPES_ORDER=['u','cc','m'];
const TYPELBL={u:'Unions',cc:'City corporations',m:'Municipalities'};
const onT={u:true,cc:true,m:true};
const fmt=n=>n.toLocaleString();
let MODE='margin';
// margin / turnout shading: same hue as the winner, intensity by value
const MARGIN_STOPS=[5,12,22,35,100], TURNOUT_STOPS=[50,57,63,70,100];
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function ramp(group,t){                    // t=0 -> pale, t=1 -> full colour
  const p=PAL[group]||PAL.Minor, a=hx(p.l), b=hx(p.d);
  return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`;
}
function shadeIdx(v,stops){ for(let i=0;i<stops.length;i++) if(v<=stops[i]) return i/(stops.length-1); return 1; }
function fillFor(p){
  const base=C[p.w]||'#555';
  if(MODE==='winner'||!p.tt) return base;
  if(MODE==='margin')  return ramp(p.w, shadeIdx(p.mg==null?0:p.mg, MARGIN_STOPS));
  if(MODE==='turnout') return p.to==null?base:ramp(p.w, shadeIdx(p.to, TURNOUT_STOPS));
  return base;
}

const map=L.map('map',{preferCanvas:true,attributionControl:false,zoomControl:true}).setView([23.8,90.3],7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{maxZoom:16,opacity:.6}).addTo(map);
// place labels sit ABOVE the choropleth so towns stay readable over colour
map.createPane('labels'); map.getPane('labels').style.zIndex=650;
map.getPane('labels').style.pointerEvents='none';
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',
  {maxZoom:16,opacity:.9,pane:'labels'}).addTo(map);

let layer, FEATS=[], sel=null;
// area-type filter only applies to local areas; constituency features (t='seat') are always shown
const vis=p=>on[p.w] && onT[p.t]!==false;
const style=f=>({fillColor:fillFor(f.properties),
                 fillOpacity:vis(f.properties)?.9:0.02,
                 // no stroke: neighbouring areas blend into a continuous political texture
                 stroke:false, weight:0});

function showInfo(p){
  if(!p.tt){
    document.getElementById('info').innerHTML=
      `<h2>${p.n||'—'}</h2><div class="loc">${TYPE[p.t]} · ${p.z||''}${p.d?', '+p.d:''}</div>
       <span class="pill" style="background:${C[p.w]}">${LBL[p.w]}</span>
       <div class="meta">${p.w==='NoResult'
         ? 'This constituency reported no result — 297 of 300 seats were declared (Sherpur-3, Chittagong-2, Chittagong-4 did not).'
         : 'No polling centres here — reserve forest / cantonment or an area merged into a neighbouring unit.'}</div>`;
    return;
  }
  const tot=p.tt||1;
  let order=B.map((b,i)=>({b,v:p.v[i]}));
  if(p.rest>0) order.push({b:'Minor',v:p.rest,lbl:'Other parties'});
  order=order.filter(o=>o.v>0).sort((a,b)=>b.v-a.v);
  document.getElementById('info').innerHTML=
    `<h2>${p.n||'—'}</h2>
     <div class="loc">${TYPE[p.t]} · ${p.z||''}${p.d?', '+p.d:''}<br>${p.c||''}</div>
     <div class="hero"><div class="hnum" style="color:${C[p.w]}">+${p.mg}</div>
       <div class="hlbl">${(LBL[p.wn]||p.wn)}<br><span>margin, pct. pts.</span></div></div>
     ${order.map(o=>`<div class="bar">
        <div class="top"><span>${o.lbl||LBL[o.b]||o.b}</span><span class="p">${fmt(o.v)} · ${(o.v/tot*100).toFixed(1)}%</span></div>
        <div class="track"><div class="fill" style="width:${(o.v/tot*100).toFixed(1)}%;background:${C[o.b]}"></div></div>
      </div>`).join('')}
     <div class="meta">${fmt(p.tt)} votes · ${p.ce} polling centre${p.ce==1?'':'s'}
       <br>Winning margin <b>${p.mg}</b> pts${p.to!=null?` · turnout <b>${p.to}%</b> of ${fmt(p.tv)} voters`:''}</div>`;
}

// ---- NYT-style result card: follows the cursor on desktop, slides up as a sheet on phones ----
const cardEl=document.getElementById('card');
const isPhone=()=>matchMedia('(max-width:760px)').matches;
function cardHTML(p){
  if(!p.tt){
    return `<h3>${p.n||'—'}</h3><div class="csub">${TYPE[p.t]} · ${p.z||''}${p.d?', '+p.d:''}</div>
      <div class="cfoot">${p.w==='NoResult'
        ? 'No result declared — 297 of 300 seats reported.'
        : 'No polling centres (reserve forest, cantonment or merged area).'}</div>`;
  }
  const tot=p.tt||1;
  let rows=B.map((b,i)=>({b,v:p.v[i]}));
  if(p.rest>0) rows.push({b:'Minor',v:p.rest,lbl:'Other parties'});
  rows=rows.filter(r=>r.v>0).sort((a,b)=>b.v-a.v).slice(0,4);
  return `<h3>${p.n||'—'}</h3>
    <div class="csub">${TYPE[p.t]} · ${p.z||''}${p.d?', '+p.d:''}${p.c?' · '+p.c:''}</div>
    <div class="cgrid">
      <div>
        <div class="chead"><span>Alliance</span><span class="num">Votes</span><span class="pct">Pct.</span></div>
        ${rows.map(r=>`<div class="crow">
          <span class="nm"><i class="dot" style="background:${C[r.b]||'#999'}"></i><b>${r.lbl||LBL[r.b]||r.b}</b></span>
          <span class="num">${fmt(r.v)}</span>
          <span class="pct">${(r.v/tot*100).toFixed(0)}%</span></div>`).join('')}
      </div>
      <div>
        <div class="mhead">Margin</div>
        <div class="mnum" style="color:${C[p.w]}">+${p.mg}</div>
        <div class="mwho" style="color:${C[p.w]}">${LBL[p.wn]||p.wn}</div>
      </div>
    </div>
    <div class="cfoot">${fmt(p.tt)} votes · ${p.ce} centre${p.ce==1?'':'s'}${p.to!=null?` · ${p.to}% turnout`:''}</div>`;
}
function showCard(p,e){
  cardEl.innerHTML=cardHTML(p); cardEl.classList.add('on');
  if(isPhone()) return;                       // sheet is pinned to the bottom on phones
  const pad=16, r=cardEl.getBoundingClientRect();
  let x=(e&&e.originalEvent?e.originalEvent.clientX:0)+pad;
  let y=(e&&e.originalEvent?e.originalEvent.clientY:0)+pad;
  if(x+r.width>innerWidth-8)  x=innerWidth-r.width-8;
  if(y+r.height>innerHeight-8) y=Math.max(8,(e&&e.originalEvent?e.originalEvent.clientY:0)-r.height-pad);
  cardEl.style.left=x+'px'; cardEl.style.top=y+'px';
}
function hideCard(){ cardEl.classList.remove('on'); }

function hi(l){ if(sel&&sel!==l) layer.resetStyle(sel);
  l.setStyle({stroke:true,weight:1.6,color:'#1e140a',opacity:1}); l.bringToFront(); sel=l; }

// Parse + TopoJSON->GeoJSON inside a Worker so the main thread never blocks
// (borrowed from the original Netra map's base64/worker approach).
function loadTopo(file){
  return new Promise((resolve,reject)=>{
    const src = "importScripts('https://unpkg.com/topojson-client@3');" +
      "self.onmessage=async e=>{try{" +
      "const r=await fetch(e.data);const t=await r.json();" +
      "self.postMessage({ok:true,fc:topojson.feature(t,t.objects.data)});" +
      "}catch(err){self.postMessage({ok:false,err:String(err)});}};";
    let w;
    const fallback=()=>fetch(file).then(r=>r.json())
        .then(t=>resolve(topojson.feature(t,t.objects.data))).catch(reject);
    try { w=new Worker(URL.createObjectURL(new Blob([src],{type:'application/javascript'}))); }
    catch(e){ return fallback(); }
    w.onmessage=ev=>{ ev.data.ok?resolve(ev.data.fc):reject(ev.data.err); w.terminate(); };
    w.onerror=fallback;
    w.postMessage(new URL(file,location.href).href);
  });
}

const CACHE={};
function getLayerData(f){ return CACHE[f] ? Promise.resolve(CACHE[f]) : loadTopo(f).then(d=>(CACHE[f]=d)); }

let LAYERFILE='units.topojson';
function buildLayer(gj){
  if(layer) layer.remove();
  sel=null; hideCard();
  FEATS=gj.features;
  layer=L.geoJSON(gj,{style,onEachFeature:(f,l)=>{
    l.on('mouseover',e=>{hi(l);showInfo(f.properties);showCard(f.properties,e);});
    l.on('mousemove',e=>{ if(!isPhone()) showCard(f.properties,e); });
    l.on('mouseout',()=>{ if(!isPhone()) hideCard(); });
    l.on('click',e=>{hi(l);showInfo(f.properties);showCard(f.properties,e);});
  }}).addTo(map);
  const ld=document.getElementById('loading'); if(ld) ld.remove();
  refreshLegendCounts();
}

function refreshLegendCounts(){
  // legend counts
  const cnt={}; LEG.forEach(b=>cnt[b]=0);
  FEATS.forEach(f=>cnt[f.properties.w]=(cnt[f.properties.w]||0)+1);
  document.getElementById('rows').innerHTML=LEG.filter(b=>cnt[b]>0).map(b=>
    `<div class="lrow" data-b="${b}"><span class="sw" style="background:${C[b]}"></span>
     <span class="nm">${LBL[b]}</span><span class="ct">${fmt(cnt[b])}</span></div>`).join('');
  document.querySelectorAll('#rows .lrow').forEach(r=>r.addEventListener('click',()=>{
    const b=r.dataset.b; on[b]=!on[b]; r.classList.toggle('off',!on[b]); layer.setStyle(style);
  }));

  // area-type filter (only meaningful for the local-area layer)
  const tcnt={u:0,cc:0,m:0}; FEATS.forEach(f=>tcnt[f.properties.t]=(tcnt[f.properties.t]||0)+1);
  document.getElementById('trows').innerHTML=TYPES_ORDER.map(t=>
    `<div class="lrow" data-t="${t}"><span class="sw" style="background:transparent;border:1px solid var(--ink2)"></span>
     <span class="nm">${TYPELBL[t]}</span><span class="ct">${fmt(tcnt[t]||0)}</span></div>`).join('');
  document.querySelectorAll('#trows .lrow').forEach(r=>r.addEventListener('click',()=>{
    const t=r.dataset.t; onT[t]=!onT[t]; r.classList.toggle('off',!onT[t]); layer.setStyle(style);
  }));
}

// view-mode scale bar
function drawScale(){
  const old=document.getElementById('scaleWrap'); if(old) old.remove();
  if(MODE==='winner') return;
  const stops = MODE==='margin'?MARGIN_STOPS:TURNOUT_STOPS;
  const d=document.createElement('div'); d.id='scaleWrap';
  d.innerHTML=`<div class="scale">${stops.map((_,i)=>
      `<i style="background:${ramp('BNP',i/(stops.length-1))}"></i>`).join('')}</div>
    <div class="scaleLbl"><span>${MODE==='margin'?'close':'low'}</span>
    <span>${MODE==='margin'?'landslide':'high turnout'}</span></div>`;
  document.getElementById('modes').after(d);
}

function setupUI(){
  // view-mode switch (winner / margin / turnout)
  drawScale();
  document.querySelectorAll('.mbtn').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.mbtn').forEach(x=>x.classList.toggle('active',x===b));
    MODE=b.dataset.m; layer.setStyle(style); drawScale();
  }));
  document.querySelectorAll('#trows .lrow').forEach(r=>r.addEventListener('click',()=>{
    const t=r.dataset.t; onT[t]=!onT[t]; r.classList.toggle('off',!onT[t]); layer.setStyle(style);
  }));

  // search
  const q=document.getElementById('q'), res=document.getElementById('res');
  q.addEventListener('input',()=>{
    const s=q.value.trim().toLowerCase();
    if(s.length<2){res.style.display='none';return;}
    const hits=FEATS.filter(f=>(f.properties.n||'').toLowerCase().includes(s)).slice(0,40);
    res.innerHTML=hits.map((f,i)=>`<div data-k="${f.properties.k}">${f.properties.n}
      <span style="color:var(--ink2)"> · ${f.properties.z||''}, ${f.properties.d||''}</span></div>`).join('')
      ||'<div style="color:var(--ink2)">no match</div>';
    res.style.display='block';
    res.querySelectorAll('div[data-k]').forEach(d=>d.addEventListener('click',()=>{
      layer.eachLayer(l=>{ if(l.feature.properties.k===d.dataset.k){
        hi(l); showInfo(l.feature.properties); map.fitBounds(l.getBounds(),{maxZoom:13,padding:[40,40]}); }});
      res.style.display='none';
    }));
  });
  document.addEventListener('click',e=>{ if(!document.getElementById('search').contains(e.target)) res.style.display='none'; });
  map.on('click',()=>{ if(isPhone()) hideCard(); });

  // ---- layer switch: local areas (5,375) <-> parliamentary constituencies (300) ----
  document.querySelectorAll('#layers .mbtn').forEach(b=>b.addEventListener('click',()=>{
    const file = b.dataset.l==='seats' ? 'constituencies.topojson' : 'units.topojson';
    if(file===LAYERFILE) return;
    document.querySelectorAll('#layers .mbtn').forEach(x=>x.classList.toggle('active',x===b));
    LAYERFILE=file;
    const seatView = b.dataset.l==='seats';
    document.querySelector('.secthead').style.display = seatView?'none':'';
    document.getElementById('trows').style.display    = seatView?'none':'';
    document.querySelector('#legend .sub').textContent = seatView
      ? 'Bangladesh 2026 · who won each of the 300 parliamentary seats'
      : 'Bangladesh 2026 · leading bloc in each union, city-corporation ward & municipality';
    getLayerData(file).then(gj=>{ buildLayer(gj); drawScale(); });
  }));
}

getLayerData('units.topojson')
  .then(gj=>{ buildLayer(gj); setupUI(); drawScale(); })
  .catch(e=>{const l=document.getElementById('loading'); if(l) l.textContent='Error loading data: '+e;});
</script>
</body>
</html>
